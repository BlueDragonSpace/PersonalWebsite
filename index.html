        <button id="generateButton">Generate Random Number</button>
        <div class="random-number" id="randomNumber"> wow number</div>

        <script>document.getElementById('generateButton').addEventListener('click', function() {
  const min = 1;
  const max = 100;
  
  const randomNumber = Math.floor(Math.random() * (max - min + 1)) + min;

  const numberDisplay = document.getElementById('randomNumber');
  numberDisplay.innerText = randomNumber;

  numberDisplay.style.transform = 'scale(1.2)';
  setTimeout(() => {
    numberDisplay.style.transform = 'scale(1)';
  }, 300);
});
        </script>
